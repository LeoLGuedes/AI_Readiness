<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ops · Prontidão IA</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <a class="brand" th:href="@{/}">
      <span class="brand-mark" aria-hidden="true">PI</span>
      <span>Prontidão IA <small>Seguradora Aurora</small></span>
    </a>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <h2 th:text="${status} == 403 ? 'Acesso não permitido' : 'Não foi possível abrir esta página'">
        Não foi possível abrir esta página
      </h2>
      <p th:if="${status} == 403">
        Esta tela pertence ao outro perfil de acesso. Cada papel enxerga apenas o que lhe cabe.
      </p>
      <p th:if="${status} == 404">O endereço pedido não existe.</p>
      <p th:if="${mensagem}" th:text="${mensagem}">Mensagem da regra.</p>
      <p class="helper" th:text="|Código ${status}|">Código</p>
      <a th:href="@{/}" class="btn btn-primary">Voltar ao início</a>
    </div>
  </main>
</div>
</body>
</html>
