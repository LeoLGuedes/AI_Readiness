# Nome fixo: rodando de P:\ (unidade do subst, ver D25) o Docker nao consegue
# deduzir o nome do projeto pela pasta.
name: artefato

services:
  postgres:
    image: postgres:16
    container_name: prontidao-ia-postgres
    environment:
      POSTGRES_DB: prontidao
      POSTGRES_USER: prontidao
      POSTGRES_PASSWORD: prontidao
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prontidao -d prontidao"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dados-postgres:
